<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI | Content Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.15), transparent 25%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .chat-header {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(to right, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-header .badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        .tool-badge {
            display: inline-block;
            margin-top: 12px;
            font-size: 0.75rem;
            padding: 4px 10px;
            background: rgba(56, 189, 248, 0.1);
            color: #7dd3fc;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .chat-input-area {
            padding: 24px;
            border-top: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.5);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 16px 20px;
            align-items: center;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Markdown basics */
        .message.bot p { margin-top: 0; }
        .message.bot p:last-child { margin-bottom: 0; }
        .message.bot pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; }
        .message.bot code { font-family: monospace; color: #a78bfa; }

    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Gemini Enterprise Content Generator</h1>
            <span class="badge">Pure Gemini SDK</span>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <p>Hello! I am your enterprise content generator. I am powered directly by the Gemini SDK, and I am securely connected to your Cloud Run MCP Server.</p>
                <p>Ask me to generate content, look up Wikipedia, perform math, or fetch GitHub stats!</p>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="prompt-input" placeholder="Type your prompt here..." autocomplete="off">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('prompt-input');
        const messagesContainer = document.getElementById('chat-messages');

        // Handle Enter key
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const prompt = input.value.trim();
            if (!prompt) return;

            // 1. Add user message to UI
            addMessage(prompt, 'user');
            input.value = '';

            // 2. Add loading indicator
            const loadingId = addLoadingIndicator();

            try {
                // 3. Call our FastAPI backend
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                
                const data = await response.json();
                
                // 4. Remove loading indicator
                document.getElementById(loadingId).remove();

                // 5. Add bot response to UI
                addMessage(data.response, 'bot', data.used_tools);

            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage("❌ Error communicating with the server.", 'bot');
            }
        }

        function addMessage(text, sender, tools = []) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            
            // Basic markdown handling (newlines to <br>)
            let formattedText = text.replace(/\n/g, '<br>');
            
            // Format bold text
            formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            let html = `<p>${formattedText}</p>`;

            if (tools && tools.length > 0) {
                html += `<div class="tool-badge">🛠️ Tools used: ${tools.join(', ')}</div>`;
            }

            div.innerHTML = html;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = `message bot typing`;
            div.innerHTML = `<span></span><span></span><span></span>`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
